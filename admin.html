/* =====================================================
   LOGIN
===================================================== */

async function login(event){

  event.preventDefault();

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("errorMessage");

  const button =
    document.getElementById("loginButton");

  error.textContent = "";

  button.disabled = true;
  button.textContent = "Logging in...";

  try{

    const url =
      API_URL +
      "?action=login" +
      "&username=" +
      encodeURIComponent(username) +
      "&password=" +
      encodeURIComponent(password) +
      "&_=" +
      Date.now();

    const response =
      await fetch(url,{
        method:"GET",
        cache:"no-store"
      });

    const text =
      await response.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch(e){
      throw new Error("Invalid server response.");
    }

    if(data.success){

      sessionStorage.setItem(
        "nashoAdminLoggedIn",
        "true"
      );

      sessionStorage.setItem(
        "nashoAdminUsername",
        username
      );

      showAdmin();

    }else{

      error.textContent =
        data.message || "Login failed.";

    }

  }catch(errorObject){

    console.error(errorObject);

    error.textContent =
      errorObject.message ||
      "Server connection failed.";

  }

  button.disabled = false;
  button.textContent = "🔐 Login";

}


/* =====================================================

/* =====================================================
   SHOW SECTION
===================================================== */

function showSection(id,button){

  document
    .querySelectorAll(".section")
    .forEach(section => {
      section.classList.remove("active");
    });

  const section =
    document.getElementById(id);

  if(section){
    section.classList.add("active");
  }

  document
    .querySelectorAll(".sidebar button")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  if(button){
    button.classList.add("active");
  }

  if(id === "dashboard"){
    loadDashboard();
  }

  if(id === "appointments"){
    loadAppointments();
  }

  if(id === "messages"){
    loadMessages();
  }

  if(id === "statistics"){

    loadAppointments();
    loadMessages();
    loadAnalysisHistory();

  }

  if(id === "allAnalysisPage"){
    loadAllAnalysis();
  }

  if(id === "recycleBin"){
    loadRecycleBin();
  }

  if(window.innerWidth <= 750){

    document
      .getElementById("sidebar")
      .classList.remove("open");

  }

}

/* =====================================================
   NORMALIZE API RESPONSE
   Supports:
   []
   {data:[]}
   {appointments:[]}
   {messages:[]}
   {recycleBin:[]}
   {analysisHistory:[]}
===================================================== */

function normalizeArray(data,preferredKey){

  if(Array.isArray(data)){
    return data;
  }

  if(!data){
    return [];
  }

  if(
    preferredKey &&
    Array.isArray(data[preferredKey])
  ){
    return data[preferredKey];
  }

  if(Array.isArray(data.data)){
    return data.data;
  }

  if(Array.isArray(data.items)){
    return data.items;
  }

  if(Array.isArray(data.results)){
    return data.results;
  }

  if(Array.isArray(data.appointments)){
    return data.appointments;
  }

  if(Array.isArray(data.messages)){
    return data.messages;
  }

  if(Array.isArray(data.recycleBin)){
    return data.recycleBin;
  }

  if(Array.isArray(data.analysis)){
    return data.analysis;
  }

  if(Array.isArray(data.analysisHistory)){
    return data.analysisHistory;
  }

  return [];

}


/* =====================================================
   GET LAST UPDATED TIME
===================================================== */

function getLastUpdated(item){

  return (
    item.updatedAt ||
    item.lastUpdated ||
    item.replyDate ||
    item.updated ||
    item.timestamp ||
    ""
  );

}

async function loadAppointments(){

  const container =
    document.getElementById(
      "appointmentsContainer"
    );

  if(container){

    container.innerHTML = `
      <div class="loading">
        🔄 Loading appointments...
      </div>
    `;

  try{

    const url =
      API_URL +
      "?action=getAppointments" +
      "&_=" +
      Date.now();

    console.log(
      "Loading appointments:",
      url
    );

    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store"
        }
      );

    console.log(
      "Appointments HTTP status:",
      response.status
    );

    const text =
      await response.text();

    console.log(
      "Appointments raw response:",
      text
    );

    let data;

    try{

      data = JSON.parse(text);

    }catch(error){

      console.error(
        "Invalid JSON:",
        text
      );

      appointments = [];

      if(container){

        container.innerHTML = `
          <div class="error-box">

            ❌ Server returned invalid data.

            <br><br>

            <small>
              Reba Apps Script Web App deployment
              na browser console.
            </small>

          </div>
        `;

      }

      updateDashboard();

      return;

    }

    console.log(
      "Appointments parsed data:",
      data
    );

    if(
      data &&
      data.success === false
    ){

      appointments = [];

      if(container){

        container.innerHTML = `
          <div class="error-box">

            ❌
            ${escapeHtml(
              data.message ||
              "Failed to load appointments."
            )}

          </div>
        `;

      }

      updateDashboard();

      return;

    }

    appointments =
      normalizeArray(
        data,
        "appointments"
      );

    console.log(
      "Normalized appointments:",
      appointments
    );

    displayAppointments();
    updateDashboard();

  }catch(error){

    console.error(
      "Appointments error:",
      error
    );

    appointments = [];

    if(container){

      container.innerHTML = `
        <div class="error-box">

          ❌ Failed to load appointments.

          <br><br>

          <small>
            ${escapeHtml(
              error.message
            )}
          </small>

        </div>
      `;

    }

    updateDashboard();

  }

}

/* =====================================================
   REPLY / UPDATE APPOINTMENT
   MAIN DASHBOARD ACTION
===================================================== */

async function replyAppointment(
  row,
  email,
  name
){

  const statusSelect =
    document.getElementById(
      "appointment-status-" + row
    );

  const textarea =
    document.getElementById(
      "appointment-reply-" + row
    );

  if(!statusSelect){

    alert(
      "Status field ntabwo ibonetse."
    );

    return;

  }

  if(!textarea){

    alert(
      "Reply box ntabwo ibonetse."
    );

    return;

  }

  const status =
    statusSelect.value;

  const reply =
    textarea.value.trim();

  if(!reply){

    alert(
      "Andika reply mbere yo gukomeza."
    );

    textarea.focus();

    return;

  }

  if(
    !confirm(
      "Ohereza reply kuri " +
      name +
      "?\n\n" +
      "Status: " +
      status
    )
  ){

    return;

  }

  try{

    const body =
      new URLSearchParams();

    body.append(
      "action",
      "updateAppointment"
    );

    body.append(
      "row",
      row
    );

    body.append(
      "status",
      status
    );

    /*
      IMPORTANT:
      Backend Code.gs expects replyText.
    */

    body.append(
      "replyText",
      reply
    );

    /*
      These are also sent for compatibility
      with different backend versions.
    */

    body.append(
      "email",
      email
    );

    body.append(
      "name",
      name
    );

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",
          body:body
        }
      );

    const text =
      await response.text();

    console.log(
      "Appointment update response:",
      text
    );

    let data;

    try{

      data =
        JSON.parse(text);

    }catch(error){

      alert(
        "Server returned invalid response."
      );

      return;

    }

    if(data.success){

      alert(
        data.message ||
        "Appointment updated and reply sent successfully."
      );

      await loadAppointments();

    }else{

      alert(
        data.message ||
        "Appointment update failed."
      );

    }

  }catch(error){

    console.error(
      "Appointment reply error:",
      error
    );

    alert(
      "Server error while updating appointment."
    );

  }

}

    const body =
      new URLSearchParams();

    body.append(
      "action",
      "updateAppointment"
    );

    body.append(
      "row",
      row
    );

    body.append(
      "status",
      status
    );

    body.append(
      "replyText",
      reply
    );

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",
          body:body
        }
      );

    const text =
      await response.text();

    console.log(
      "Status update response:",
      text
    );

    let data;

    try{

      data =
        JSON.parse(text);

    }catch(error){

      return;

    }

    if(data.success){

      await loadAppointments();

    }else{

      alert(
        data.message ||
        "Status update failed."
      );

    }

  }catch(error){

    console.error(
      error
    );

    alert(
      "Server error while updating status."
    );

  }

}

/* =====================================================
   ANALYSIS
===================================================== */

function generateAnalysis(){

  if(
    !appointments.length &&
    !messages.length
  ){

    alert(
      "Nta data ihari yo gusesengura."
    );

    return;

  }

  const dataType =
    document.getElementById(
      "dataType"
    ).value;

  const chartType =
    document.getElementById(
      "chartType"
    ).value;

  let labels = [];
  let values = [];

  if(dataType === "appointmentStatus"){

    labels = [
      "Pending",
      "Confirmed",
      "Completed",
      "Cancelled"
    ];

    values =
      labels.map(
        status =>
          appointments.filter(
            item =>
              String(
                item.status ||
                "Pending"
              ) === status
          ).length
      );

  }

  else if(dataType === "departments"){

    const counts = {};

    appointments.forEach(item => {

      const department =
        item.department ||
        "Unknown";

      counts[department] =
        (counts[department] || 0) + 1;

    });

    labels =
      Object.keys(counts);

    values =
      Object.values(counts);

  }

  else if(dataType === "appointmentTrend"){

    const counts = {};

    appointments.forEach(item => {

      const date =
        item.date ||
        "Unknown";

      counts[date] =
        (counts[date] || 0) + 1;

    });

    labels =
      Object.keys(counts);

    values =
      Object.values(counts);

  }

  else if(dataType === "messageStatus"){

    const counts = {};

    messages.forEach(item => {

      const status =
        item.status ||
        "New";

      counts[status] =
        (counts[status] || 0) + 1;

    });

    labels =
      Object.keys(counts);

    values =
      Object.values(counts);

  }

  else if(dataType === "messageTrend"){

    const counts = {};

    messages.forEach(item => {

      const date =
        String(
          item.timestamp ||
          "Unknown"
        ).substring(0,10);

      counts[date] =
        (counts[date] || 0) + 1;

    });

    labels =
      Object.keys(counts);

    values =
      Object.values(counts);

  }

  if(!labels.length){

    alert(
      "Nta data yabonetse."
    );

    return;

  }

  clearChart();

  const canvas =
    document.getElementById(
      "analysisChart"
    );

  const ctx =
    canvas.getContext("2d");

  analysisChart =
    new Chart(
      ctx,
      {
        type:chartType,

        data:{
          labels:labels,

          datasets:[{

            label:
              document
                .getElementById(
                  "analysisTitle"
                )
                .value
                .trim() ||
              "NASHO Health Center Analysis",

            data:values,

            borderWidth:2

          }]

        },

        options:{

          responsive:true,

          maintainAspectRatio:false,

          plugins:{
            legend:{
              display:true
            }
          },

          scales:
            chartType === "pie" ||
            chartType === "doughnut"
            ?
            {}
            :
            {
              y:{
                beginAtZero:true
              }
            }

        }

      }
    );

}

function updateDashboard(){

      "pendingAppointments"
    );

    );

      "newMessages"
    );

  if(total){

    total.textContent =
      appointments.length;

  }

  if(pending){

    pending.textContent =
      appointments.filter(item => {

        return String(
          item.status ||
          "Pending"
        ).toLowerCase() === "pending";

      }).length;

  }

  if(totalMessages){

    totalMessages.textContent =
      messages.length;

  }

  if(newMessages){

    newMessages.textContent =
      messages.filter(item => {

        return (
          !item.status ||
          String(item.status).toLowerCase() === "new"
        );

      }).length;

  }

}


/* =====================================================
   MESSAGE STATUS
===================================================== */

function messageStatus(status){

  const s =
    status || "New";

  let className =
    "status-new";

  if(s === "Replied"){

    className =
      "status-replied";

  }

  return `
    <span class="status ${className}">
      ${escapeHtml(s)}
    </span>
  `;

}


/* =====================================================
   APPOINTMENT STATUS
===================================================== */

function appointmentStatus(status){

  const s =
    status || "Pending";

  let className =
    "status-pending";

  if(s === "Confirmed"){

    className =
      "status-confirmed";

  }

  if(s === "Completed"){

    className =
      "status-completed";

  }

  if(s === "Cancelled"){

    className =
      "status-cancelled";

  }

  return `
    <span class="status ${className}">
      ${escapeHtml(s)}
    </span>
  `;

}


/* =====================================================
   DATE PARSER
===================================================== */

function parseDateValue(value){

  if(!value){
    return 0;
  }

  const parsed =
    Date.parse(value);

  if(!isNaN(parsed)){
    return parsed;
  }

  return 0;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =====================================================
   ESCAPE JS
===================================================== */

function escapeJs(value){

  return String(
    value ?? ""
  )
  .replace(/\\/g,"\\\\")
  .replace(/'/g,"\\'")
  .replace(/\r/g,"\\r")
  .replace(/\n/g,"\\n");

}
