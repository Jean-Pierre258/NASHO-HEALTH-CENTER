<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NASHO Health Center | Admin Dashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    color:#172033;
}

.login-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.12);
}

.login-box h1{
    text-align:center;
    margin-bottom:10px;
}

.login-box p{
    text-align:center;
    color:#687386;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:14px;
    border:1px solid #dce2ea;
    border-radius:10px;
    margin-bottom:15px;
    font-size:15px;
}

.btn{
    border:0;
    padding:13px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.btn-primary{
    background:#1769e0;
    color:white;
    width:100%;
}

.dashboard{
    display:none;
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:250px;
    background:#102a43;
    color:white;
    padding:25px 15px;
}

.logo{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:35px;
}

.nav-btn{
    width:100%;
    border:0;
    background:transparent;
    color:white;
    text-align:left;
    padding:14px;
    margin-bottom:7px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

.nav-btn:hover,
.nav-btn.active{
    background:#1769e0;
}

.logout{
    position:absolute;
    bottom:25px;
    left:15px;
    right:15px;
    background:#c0392b;
}

.main{
    margin-left:250px;
    padding:30px;
}

.topbar{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:25px;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.card span{
    color:#687386;
}

.card strong{
    display:block;
    font-size:30px;
    margin-top:10px;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.panel{
    background:white;
    padding:25px;
    border-radius:15px;
    overflow-x:auto;
}

.search{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:10px;
    margin:15px 0;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th,td{
    padding:13px;
    border-bottom:1px solid #edf0f4;
    text-align:left;
}

th{
    background:#f7f9fc;
}

.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.confirmed{
    background:#d4edda;
    color:#155724;
}

.cancelled{
    background:#f8d7da;
    color:#721c24;
}

.action-btn{
    border:0;
    padding:7px 10px;
    margin:2px;
    border-radius:7px;
    cursor:pointer;
}

.confirm{
    background:#28a745;
    color:white;
}

.cancel{
    background:#dc3545;
    color:white;
}

.reply{
    background:#1769e0;
    color:white;
}

@media(max-width:900px){
    .sidebar{
        width:210px;
    }

    .main{
        margin-left:210px;
    }

    .cards{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:650px){
    .sidebar{
        position:relative;
        width:100%;
        height:auto;
    }

    .logout{
        position:relative;
        left:auto;
        right:auto;
        bottom:auto;
        margin-top:10px;
    }

    .main{
        margin-left:0;
        padding:15px;
    }

    .cards{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="login-page" id="loginPage">

    <div class="login-box">

        <h1>🏥 NASHO</h1>

        <p>Health Center Admin</p>

        <input
            class="input"
            type="text"
            id="username"
            placeholder="Admin username"
        >

        <input
            class="input"
            type="password"
            id="password"
            placeholder="Password"
        >

        <button
            class="btn btn-primary"
            onclick="login()"
        >
            🔐 Login
        </button>

        <p id="loginMessage" style="margin-top:15px;color:#c0392b;"></p>

    </div>

</div>


<!-- DASHBOARD -->

<div class="dashboard" id="dashboard">

    <aside class="sidebar">

        <div class="logo">
            🏥 NASHO HC
        </div>

        <button class="nav-btn active" onclick="showSection('dashboardSection',this)">
            📊 Dashboard
        </button>

        <button class="nav-btn" onclick="showSection('appointments',this)">
            📅 Appointments
        </button>

        <button class="nav-btn" onclick="showSection('messages',this)">
            ✉️ Messages
        </button>

        <button class="nav-btn" onclick="showSection('statistics',this)">
            📈 Statistics
        </button>

        <button class="nav-btn logout" onclick="logout()">
            🚪 Logout
        </button>

    </aside>


    <main class="main">

        <div class="topbar">

            <div>
                <h2>NASHO Health Center</h2>
                <span>Admin Dashboard</span>
            </div>

            <strong id="today"></strong>

        </div>


        <!-- DASHBOARD -->

        <section class="section active" id="dashboardSection">

            <div class="cards">

                <div class="card">
                    <span>📅 Appointments</span>
                    <strong id="totalAppointments">0</strong>
                </div>

                <div class="card">
                    <span>⏳ Pending</span>
                    <strong id="pendingAppointments">0</strong>
                </div>

                <div class="card">
                    <span>✅ Confirmed</span>
                    <strong id="confirmedAppointments">0</strong>
                </div>

                <div class="card">
                    <span>✉️ Messages</span>
                    <strong id="totalMessages">0</strong>
                </div>

            </div>

        </section>


        <!-- APPOINTMENTS -->

        <section class="section" id="appointments">

            <div class="panel">

                <h2>📅 Appointments</h2>

                <input
                    class="search"
                    id="appointmentSearch"
                    placeholder="Search name, phone, department..."
                    onkeyup="filterAppointments()"
                >

                <div id="appointmentsTable">
                    Loading appointments...
                </div>

            </div>

        </section>


        <!-- MESSAGES -->

        <section class="section" id="messages">

            <div class="panel">

                <h2>✉️ Messages</h2>

                <div id="messagesTable">
                    Messages will appear here.
                </div>

            </div>

        </section>


        <!-- STATISTICS -->

        <section class="section" id="statistics">

            <div class="panel">

                <h2>📈 Statistics</h2>

                <p style="margin-top:15px;">
                    Appointment statistics will appear here.
                </p>

            </div>

        </section>

    </main>

</div>


<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzVlDEG0luk1s6p8PTRF5lvfFDuu3ZT4h9C53igSLbqwkIV0saKh8GRJmYfskutpeOSOA/exec";


/* LOGIN */

function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    /*
       TEMPORARY LOGIN
       We will move authentication to Apps Script
       before using this dashboard in production.
    */

    if(username === "admin" && password === "Nasho@2026"){

        document.getElementById("loginPage").style.display="none";

        document.getElementById("dashboard").style.display="block";

        loadAppointments();

    }else{

        document.getElementById("loginMessage").innerText =
            "Username cyangwa password ntabwo ari byo.";

    }

}


/* LOGOUT */

function logout(){

    document.getElementById("dashboard").style.display="none";

    document.getElementById("loginPage").style.display="flex";

    document.getElementById("password").value="";

}


/* NAVIGATION */

function showSection(id,button){

    document.querySelectorAll(".section")
        .forEach(section=>{
            section.classList.remove("active");
        });

    document.getElementById(id)
        .classList.add("active");

    document.querySelectorAll(".nav-btn")
        .forEach(btn=>{
            btn.classList.remove("active");
        });

    button.classList.add("active");

    if(id === "appointments"){
        loadAppointments();
    }

}


/* DATE */

document.getElementById("today").innerText =
    new Date().toLocaleDateString("rw-RW");


/* LOAD APPOINTMENTS */

function loadAppointments(){

    document.getElementById("appointmentsTable").innerHTML =
        "Loading appointments...";

    fetch(WEB_APP_URL + "?action=getAppointments")
        .then(response => response.json())
        .then(data => {

            if(!data || !data.appointments){

                document.getElementById("appointmentsTable").innerHTML =
                    "Nta appointments zabonetse.";

                return;
            }

            window.allAppointments = data.appointments;

            displayAppointments(data.appointments);

            updateDashboard(data.appointments);

        })
        .catch(error => {

            console.error(error);

            document.getElementById("appointmentsTable").innerHTML =
                "<p style='color:red'>Failed to load appointments.</p>";

        });

}


/* DISPLAY */

function displayAppointments(data){

    if(data.length === 0){

        document.getElementById("appointmentsTable").innerHTML =
            "<p>Nta appointment iraboneka.</p>";

        return;
    }


    let html = `
    <table>

        <thead>

            <tr>
                <th>Timestamp</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Patient ID</th>
                <th>Department</th>
                <th>Date</th>
                <th>Time</th>
                <th>Message</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>

        </thead>

        <tbody>
    `;


    data.forEach((item,index)=>{

        const status =
            item.status || "Pending";

        let statusClass = "pending";

        if(status === "Confirmed")
            statusClass = "confirmed";

        if(status === "Cancelled")
            statusClass = "cancelled";


        html += `
        <tr>

            <td>${escapeHTML(item.timestamp || "")}</td>

            <td>${escapeHTML(item.name || "")}</td>

            <td>${escapeHTML(item.phone || "")}</td>

            <td>${escapeHTML(item.patientId || "")}</td>

            <td>${escapeHTML(item.department || "")}</td>

            <td>${escapeHTML(item.date || "")}</td>

            <td>${escapeHTML(item.time || "")}</td>

            <td>${escapeHTML(item.message || "")}</td>

            <td>
                <span class="status ${statusClass}">
                    ${escapeHTML(status)}
                </span>
            </td>

            <td>

                <button
                    class="action-btn confirm"
                    onclick="updateAppointment(${index},'Confirmed')">
                    ✓
                </button>

                <button
                    class="action-btn cancel"
                    onclick="updateAppointment(${index},'Cancelled')">
                    ✕
                </button>

                <button
                    class="action-btn reply"
                    onclick="replyAppointment(${index})">
                    💬
                </button>

            </td>

        </tr>
        `;

    });


    html += `
        </tbody>
    </table>
    `;


    document.getElementById("appointmentsTable").innerHTML = html;

}


/* SEARCH */

function filterAppointments(){

    const search =
        document.getElementById("appointmentSearch")
        .value
        .toLowerCase();

    const filtered =
        (window.allAppointments || []).filter(item =>

            JSON.stringify(item)
            .toLowerCase()
            .includes(search)

        );

    displayAppointments(filtered);

}


/* UPDATE APPOINTMENT */

function updateAppointment(index,status){

    const appointment =
        window.allAppointments[index];

    if(!appointment) return;


    if(!confirm(
        "Hindura status ibe " + status + "?"
    )){
        return;
    }


    const params = new URLSearchParams();

    params.append("action","updateAppointment");

    params.append("row",appointment.row);

    params.append("status",status);


    fetch(WEB_APP_URL,{
        method:"POST",
        body:params
    })
    .then(response => response.json())
    .then(result => {

        if(result.success){

            alert("Appointment updated successfully.");

            loadAppointments();

        }else{

            alert(result.message || "Update failed.");

        }

    })
    .catch(error => {

        console.error(error);

        alert("Could not update appointment.");

    });

}


/* REPLY */

function replyAppointment(index){

    const appointment =
        window.allAppointments[index];

    if(!appointment) return;


    const message = prompt(
        "Andika ubutumwa bwoherezwa kuri " +
        appointment.email
    );

    if(!message) return;


    const params = new URLSearchParams();

    params.append("action","replyAppointment");

    params.append("email",appointment.email);

    params.append("name",appointment.name);

    params.append("message",message);


    fetch(WEB_APP_URL,{
        method:"POST",
        body:params
    })
    .then(response => response.json())
    .then(result => {

        if(result.success){

            alert("Reply sent successfully.");

        }else{

            alert(result.message || "Reply failed.");

        }

    })
    .catch(error => {

        console.error(error);

        alert("Could not send reply.");

    });

}


/* DASHBOARD COUNTS */

function updateDashboard(data){

    document.getElementById("totalAppointments")
        .innerText = data.length;

    document.getElementById("pendingAppointments")
        .innerText =
        data.filter(x =>
            (x.status || "Pending") === "Pending"
        ).length;

    document.getElementById("confirmedAppointments")
        .innerText =
        data.filter(x =>
            x.status === "Confirmed"
        ).length;

}


/* SECURITY */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
